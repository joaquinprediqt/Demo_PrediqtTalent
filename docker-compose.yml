services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: prediqt-talent:local
    container_name: prediqt-talent
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # La base SQLite de la demo vive dentro del contenedor. Sin este volumen
      # se perderia en cada `docker compose down` y con ella los perfiles,
      # habilidades y documentos que se hayan cargado durante la demostracion.
      - datos:/app/data
    healthcheck:
      # La imagen es alpine y no trae curl. Se usa el propio Node, que siempre
      # esta disponible, en vez de instalar un paquete extra solo para esto.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      # El primer arranque crea y siembra la base, asi que se le da margen
      # antes de empezar a contar fallos.
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  datos:
